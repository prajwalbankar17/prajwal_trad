[project]
name = "prajwal-trading-backend"
version = "0.1.0"
description = "AI-powered equity research and paper-trading platform (backend)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]   # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: tests that need a live PostgreSQL/Redis",
]

asyncio_default_fixture_loop_scope = "function"
